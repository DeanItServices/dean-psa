# Legion directory ownership map for MSP PSA.
# Generated by /legion:map at commit b4c6dd2 on 2026-09-15.
# Consumers use this to decide which directory owns a concern before planning edits.

schema_version: 1
project: MSP PSA
root: .

conventions:
  path_alias:
    "@/*": src/*
  layering:
    description: >-
      Strictly one-way. Routes import components, components import actions,
      actions import lib. Nothing in src/lib imports from src/app or src/components.
    order:
      - src/app
      - src/components
      - src/lib/actions
      - src/lib
      - prisma
  write_boundary: src/lib/actions
  validation_boundary: src/lib/validations
  authorization_choke_point: src/lib/session.ts
  page_gates:
    session_only: requireActiveUser()
    role_restricted: requireRole(X_ROLES)
    note: >-
      Do not open-code getCurrentUser() + redirect() in a page. src/lib/session.ts is
      Node-runtime only and must never be imported from middleware.
  serialized_invariants:
    active_admin_count: >-
      Every code path that could reduce the number of active admins must take the
      ADMIN_INVARIANT_LOCK_KEY advisory lock (src/lib/actions/users.ts), or it is not
      serialized against the others.

directories:
  - path: src/app/(auth)
    owns: Unauthenticated surfaces — login and change-password
    domain: auth
    notes: >-
      Layout performs no session check. That is load-bearing, not an oversight:
      /change-password lives here and must not redirect-loop through the dashboard gate.

  - path: src/app/(dashboard)
    owns: All authenticated pages and the app shell
    domain: routing
    notes: >-
      layout.tsx gates and redirects, but does NOT re-render on soft navigation — each
      leaf page calls requireActiveUser() or requireRole() as well. 15 routes.

  - path: src/app/api
    owns: Route handlers (NextAuth catch-all, QBO OAuth connect/callback)
    domain: integration
    notes: >-
      Only 3 handlers. Mutations belong in Server Actions, not here. GET /api/auth/session
      is exempt from the middleware gate and never consults getCurrentUser().

  - path: src/components/ui
    owns: shadcn/ui primitives over radix-ui
    domain: ui
    generated: true
    notes: 13 components. Avoid hand-editing; regenerate instead.

  - path: src/components/admin
    owns: User create form and per-row admin actions
    domain: admin

  - path: src/components/crm
    owns: Company, site, contact, contract and asset forms and tabs
    domain: crm
    notes: "*-tab.tsx are async Server Components; *-form.tsx are client forms."

  - path: src/components/tickets
    owns: Kanban board, ticket form, timer control, SLA badge, comments
    domain: tickets

  - path: src/components/invoices
    owns: Invoice generation form, line table, status badge, QBO push button
    domain: billing

  - path: src/components/reports
    owns: Report filters and tables
    domain: reporting

  - path: src/components/nav
    owns: Sidebar and user menu
    domain: ui
    notes: >-
      AppSidebar has a real Admin section with two independently gated destinations,
      /admin/quickbooks (qbo:manage) and /admin/users (admin:manage_users).

  - path: src/lib/actions
    owns: Server Actions — the only mutation path
    domain: multiple
    notes: >-
      40 actions across 13 modules. Every action calls requireRole() first, parses with
      zod second, writes third, then revalidatePath(). users.ts additionally enforces the
      self-target and last-active-admin guard rails.

  - path: src/lib/validations
    owns: zod input schemas
    domain: validation
    notes: contract.ts is a discriminatedUnion over billingType.

  - path: src/lib
    owns: Domain logic and infrastructure
    domain: multiple
    notes: >-
      billing.ts, sla.ts and timer.ts are pure — keep Prisma out of them. db.ts (33),
      session.ts (32) and permissions.ts (30) are the three highest fan-in modules.
      bootstrap-admin.ts has zero importers in src/ by design — it serves the CLI.

  - path: prisma
    owns: Schema, 10 migrations, seed
    domain: data
    notes: >-
      seed.ts creates the five role accounts. It is no longer the only user-creation
      path — see src/lib/actions/users.ts and scripts/create-admin.ts.

  - path: scripts
    owns: Standalone workers and CLIs
    domain: multiple
    notes: >-
      email-poller.ts runs as its own Compose service; create-admin.ts is the
      out-of-band admin recovery CLI; post-migrate.sh runs from db:migrate:deploy.

  - path: e2e
    owns: Playwright specs and support modules
    domain: testing
    notes: >-
      Three projects. lifecycle (+ last-active-admin) is the blocking gate run by
      npm run test:e2e. advisory holds the three pre-Phase-7 specs, which have never run
      against a browser and block nothing. Targets the dev database.

  - path: types
    owns: Ambient type augmentation
    domain: auth
    notes: >-
      next-auth.d.ts adds id/role to Session.user and id/role/tokenVersion to the JWT.
      tokenVersion is deliberately absent from Session — anything there goes on the wire.

excluded:
  - node_modules
  - .next
  - .git
  - .planning
  - .claude

entry_points:
  dev: npm run dev
  build: npm run build
  lint: npm run lint
  e2e_gate: npm run test:e2e
  e2e_advisory: npm run test:e2e:advisory
  e2e_all: npm run test:e2e:all
  worker: npm run email-poller
  bootstrap_admin: npm run bootstrap:admin
  migrate: npm run db:migrate
  migrate_deploy: npm run db:migrate:deploy
  seed: npm run db:seed
