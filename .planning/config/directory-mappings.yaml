# Legion directory ownership map for MSP PSA.
# Generated by /legion:map at commit f2e1113 on 2026-09-02.
# Consumers use this to decide which directory owns a concern before planning edits.

schema_version: 1
project: MSP PSA
root: .

conventions:
  path_alias:
    "@/*": src/*
  layering:
    description: >-
      Strictly one-way. Routes import components, components import actions,
      actions import lib. Nothing in src/lib imports from src/app or src/components.
    order:
      - src/app
      - src/components
      - src/lib/actions
      - src/lib
      - prisma
  write_boundary: src/lib/actions
  validation_boundary: src/lib/validations
  authorization_choke_point: src/lib/session.ts

directories:
  - path: src/app/(auth)
    owns: Unauthenticated surfaces
    domain: auth
    notes: Layout performs no session check; routes placed here sit outside the dashboard redirect gate.

  - path: src/app/(dashboard)
    owns: All authenticated pages and the app shell
    domain: routing
    notes: layout.tsx calls getCurrentUser() and redirects to /login. Shared loading.tsx and error.tsx cover 13 routes.

  - path: src/app/api
    owns: Route handlers (NextAuth catch-all, QBO OAuth connect/callback)
    domain: integration
    notes: Only 3 handlers. Mutations belong in Server Actions, not here.

  - path: src/components/ui
    owns: shadcn/ui primitives over radix-ui
    domain: ui
    generated: true
    notes: 12 components. Avoid hand-editing; regenerate instead.

  - path: src/components/crm
    owns: Company, site, contact, contract and asset forms and tabs
    domain: crm
    notes: "*-tab.tsx are async Server Components; *-form.tsx are client forms."

  - path: src/components/tickets
    owns: Kanban board, ticket form, timer control, SLA badge, comments
    domain: tickets

  - path: src/components/invoices
    owns: Invoice generation form, line table, status badge, QBO push button
    domain: billing

  - path: src/components/reports
    owns: Report filters and tables
    domain: reporting

  - path: src/components/nav
    owns: Sidebar and user menu
    domain: ui
    notes: AppSidebar's Admin section is gated on admin:manage_users and currently holds only the QuickBooks link.

  - path: src/lib/actions
    owns: Server Actions — the only mutation path
    domain: multiple
    notes: Every action calls requireRole() first, parses with zod second, writes third, then revalidatePath().

  - path: src/lib/validations
    owns: zod input schemas
    domain: validation
    notes: contract.ts is a discriminatedUnion over billingType.

  - path: src/lib
    owns: Domain logic and infrastructure
    domain: multiple
    notes: billing.ts, sla.ts and timer.ts are pure — keep Prisma out of them. db.ts, permissions.ts and session.ts are the three highest fan-in modules.

  - path: prisma
    owns: Schema, migrations, seed
    domain: data
    notes: seed.ts is the only user-creation path in the tree.

  - path: scripts
    owns: Standalone workers and shell helpers
    domain: integration
    notes: email-poller.ts runs as its own Compose service; post-migrate.sh runs from db:migrate:deploy.

  - path: e2e
    owns: Playwright specs and fixtures
    domain: testing
    notes: Runs against the dev database with fullyParallel true. Never executed against a real browser.

  - path: types
    owns: Ambient type augmentation
    domain: auth
    notes: next-auth.d.ts adds id and role to Session.user and the JWT.

excluded:
  - node_modules
  - .next
  - .git
  - .planning
  - .claude

entry_points:
  dev: npm run dev
  build: npm run build
  lint: npm run lint
  e2e: npm run test:e2e
  worker: npm run email-poller
  migrate: npm run db:migrate
  migrate_deploy: npm run db:migrate:deploy
  seed: npm run db:seed
