services:
  caddy:
    image: caddy:alpine
    ports:
      # Overridable so a second stack can run side by side, the same reason
      # DB_PORT exists. HTTP-01 issuance requires the PUBLIC :80 to reach this
      # container, so HTTP_PORT stays 80 on the deployment that serves traffic.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required - the public hostname Caddy serves, e.g. psa.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing /data forces re-issuance
      # and can hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
  app:
    build: .
    # No ports: the app is reachable only on the internal Compose network, at
    # app:3000, which is where caddy proxies. Publishing 3000 again would let a
    # client bypass Caddy and forge X-Forwarded-For directly.
    #
    # List form, not mapping form: a bare key is OMITTED from the container when
    # the variable is unset, whereas `KEY: ${KEY}` injects an empty string --
    # and envInt() in src/proxy.ts rejects empty, so every default deployment
    # would log warnings at start. Compose resolves bare keys from .env.
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}@db:5432/msp_psa?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      # No :- default. An unset AUTH_URL behind TLS silently yields a non-Secure
      # session cookie: Auth.js picks the __Secure- prefix from url.protocol
      # alone (src/lib/session.ts), with no error to notice.
      - AUTH_URL=${AUTH_URL:?AUTH_URL is required and must be the public https URL, e.g. https://psa.example.com}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # Optional rate-limit overrides read by src/proxy.ts at process start.
      # Compose's .env interpolates this file only and never reaches a
      # container, so these must be enumerated here or the reads are always
      # undefined and the limiter silently stays at its defaults.
      - RATE_LIMIT_WINDOW_MS
      - RATE_LIMIT_GENERAL
      - RATE_LIMIT_AUTH
      # QuickBooks Online + token encryption. Same reason as the block above:
      # .dockerignore excludes .env from the build context and Compose's .env is
      # interpolation-only, so a key not named here simply does not exist inside
      # the container no matter how carefully the operator filled in .env.
      # src/lib/qbo.ts (:27,:28,:45), src/lib/actions/invoices.ts (:280) and
      # src/lib/crypto.ts (:27) read all five straight off process.env, so
      # omitting them makes every QuickBooks path fail at runtime.
      #
      # Bare keys, for the list-form reason above: QBO is optional, and the
      # mapping form would inject "" for an operator who never configured it,
      # turning "not connected" into a confusing empty-credential error.
      - QBO_CLIENT_ID
      - QBO_CLIENT_SECRET
      - QBO_ENVIRONMENT
      - QBO_REDIRECT_URI
      - TOKEN_ENCRYPTION_KEY
    depends_on:
      - db
  email-poller:
    build: .
    command: ["npm", "run", "email-poller"]
    # Opt-in. scripts/email-poller.ts calls requireEnv() for all four AZURE_*/
    # MAILBOX_ADDRESS values at MODULE LOAD, so without them the container
    # throws immediately and sits in Exited(1) forever -- with no restart policy
    # it does not loop, it just shows up as a permanently failed service in
    # `docker compose ps` on every deployment that does not use email-to-ticket.
    # A profile keeps it out of the default `up` instead of normalising a red
    # service. To run it, fill in the Azure block in .env and start the stack
    # with `docker compose --profile email up -d` (the flag is required on
    # EVERY compose command that should include it -- see DEPLOYMENT.md).
    profiles: ["email"]
    # List form, same reasoning as `app` above.
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}@db:5432/msp_psa?schema=public
      - AZURE_TENANT_ID
      - AZURE_CLIENT_ID
      - AZURE_CLIENT_SECRET
      - MAILBOX_ADDRESS
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      # No :- default: an unset variable must fail the stack, not start Postgres
      # with a guessable or empty password. Note this applies at initdb ONLY --
      # an existing pgdata volume keeps its old password until ALTER USER.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
      POSTGRES_DB: msp_psa
    ports:
      # Loopback-scoped: Postgres is reachable from this host (migrations, seed,
      # bootstrap:admin and the E2E suite all run host-side) but from nowhere
      # else on the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  caddy_data:
  caddy_config:
